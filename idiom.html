<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成語代號大作戰 - 三年級國語</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Zen+Maru+Gothic:wght@500;700&display=swap');
        
        body {
            font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
            background-color: #FDF6E3; /* 護眼米黃色背景 */
            background-image: radial-gradient(#E6D7B9 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .chalkboard {
            background-color: #2D3748;
            border: 12px solid #8B4513;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            color: white;
        }

        .chalk-text {
            font-family: 'Zen Maru Gothic', sans-serif;
            text-shadow: 1px 1px 0 rgba(255,255,255,0.2);
        }

        .option-card {
            transition: all 0.2s;
            cursor: pointer;
            border-bottom: 4px solid #E2E8F0;
        }
        .option-card:active {
            transform: translateY(2px);
            border-bottom-width: 0px;
        }
        
        .correct-anim {
            animation: bounce 0.5s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* 自定義進度條動畫 */
        .progress-bar {
            transition: width 0.5s ease-out;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center overflow-hidden relative">

    <!-- 遊戲主容器 -->
    <div id="gameContainer" class="w-full max-w-4xl h-full md:h-auto p-4 flex flex-col relative z-10">
        
        <!-- 頂部資訊列 -->
        <div class="flex justify-between items-center mb-4 bg-white/80 backdrop-blur rounded-2xl p-3 shadow-sm border-2 border-orange-200">
            <div class="flex items-center gap-2">
                <div class="bg-orange-100 p-2 rounded-full">
                    <i data-lucide="graduation-cap" class="w-6 h-6 text-orange-600"></i>
                </div>
                <div>
                    <div class="text-xs text-gray-500 font-bold">得分</div>
                    <div class="text-xl font-black text-orange-600" id="scoreDisplay">0</div>
                </div>
            </div>
            
            <div class="flex-1 mx-4">
                <div class="flex justify-between text-xs text-gray-500 mb-1 font-bold">
                    <span>進度</span>
                    <span id="progressText">1/10</span>
                </div>
                <div class="h-3 bg-gray-200 rounded-full overflow-hidden">
                    <div id="progressBar" class="h-full bg-green-500 progress-bar" style="width: 0%"></div>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <div class="bg-blue-100 p-2 rounded-full">
                    <i data-lucide="timer" class="w-6 h-6 text-blue-600"></i>
                </div>
                <!-- 簡單的計時器增加緊張感 -->
                <div class="text-xl font-black text-blue-600" id="timerDisplay">00:00</div>
            </div>
        </div>

        <!-- 題目區 (黑板風格) -->
        <div class="chalkboard p-6 md:p-10 mb-6 relative min-h-[200px] flex flex-col items-center justify-center text-center">
            <!-- 裝飾：板擦與粉筆 -->
            <div class="absolute bottom-2 right-4 flex gap-2 opacity-80">
                <div class="w-16 h-6 bg-yellow-100 rounded shadow-sm transform rotate-3"></div>
                <div class="w-20 h-8 bg-amber-800 rounded shadow-sm border-b-4 border-black/20"></div>
            </div>
            
            <h2 class="text-orange-200 text-lg md:text-xl mb-4 font-bold tracking-widest border-b-2 border-dashed border-gray-500 pb-2">
                請將正確代號填入空格
            </h2>
            
            <p id="questionText" class="chalk-text text-2xl md:text-3xl leading-relaxed">
                <!-- 題目會在這裡 -->
                載入中...
            </p>
        </div>

        <!-- 選項區 -->
        <div id="optionsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- 選項會由 JS 生成 -->
        </div>

    </div>

    <!-- 開始畫面 Modal -->
    <div id="startScreen" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full text-center shadow-2xl border-b-8 border-green-500">
            <div class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                <i data-lucide="book-open" class="w-12 h-12 text-green-600"></i>
            </div>
            <h1 class="text-3xl font-black text-gray-800 mb-2">成語代號大作戰</h1>
            <p class="text-gray-600 mb-8 font-medium">我是國語老師，準備好挑戰這 20 個成語了嗎？選出正確的代號填入句子裡！</p>
            <button onclick="startGame()" class="w-full py-4 bg-green-500 hover:bg-green-600 text-white rounded-2xl font-bold text-xl shadow-lg transform active:scale-95 transition-all">
                老師，我準備好了！
            </button>
        </div>
    </div>

    <!-- 結算畫面 Modal -->
    <div id="endScreen" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full text-center shadow-2xl border-b-8 border-yellow-400">
            <div class="w-24 h-24 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-6">
                <i data-lucide="trophy" class="w-12 h-12 text-yellow-500"></i>
            </div>
            <h2 class="text-3xl font-black text-gray-800 mb-2">測驗結束！</h2>
            <div class="text-4xl font-black text-orange-500 mb-4" id="finalScore">100分</div>
            <p id="teacherComment" class="text-gray-600 mb-8 font-medium bg-gray-50 p-4 rounded-xl">
                <!-- 老師評語 -->
            </p>
            <button onclick="restartGame()" class="w-full py-4 bg-blue-500 hover:bg-blue-600 text-white rounded-2xl font-bold text-xl shadow-lg transform active:scale-95 transition-all flex items-center justify-center gap-2">
                <i data-lucide="refresh-ccw"></i> 再挑戰一次
            </button>
        </div>
    </div>

    <!-- 答錯/答對反饋 Modal -->
    <div id="feedbackModal" class="hidden fixed inset-0 bg-black/40 z-40 flex items-end md:items-center justify-center p-4">
        <div id="feedbackCard" class="bg-white rounded-t-3xl md:rounded-3xl p-6 w-full max-w-lg shadow-2xl transform transition-transform translate-y-full md:translate-y-0 duration-300">
            <div class="flex items-center gap-3 mb-3">
                <div id="feedbackIcon" class="p-2 rounded-full"></div>
                <h3 id="feedbackTitle" class="text-xl font-bold"></h3>
            </div>
            
            <div class="bg-gray-50 p-4 rounded-xl border-l-4 border-gray-300 mb-4">
                <p class="text-sm text-gray-500 font-bold mb-1">正確成語：</p>
                <p id="feedbackCorrectAnswer" class="text-lg font-black text-gray-800 mb-2"></p>
                <p class="text-sm text-gray-500 font-bold mb-1">老師小撇步（解釋）：</p>
                <p id="feedbackDefinition" class="text-gray-700"></p>
            </div>

            <button onclick="nextQuestion()" class="w-full py-3 bg-gray-800 text-white rounded-xl font-bold text-lg">
                下一題 <i data-lucide="arrow-right" class="inline w-5 h-5 ml-1"></i>
            </button>
        </div>
    </div>

    <!-- 撒花特效 Canvas -->
    <canvas id="confettiCanvas" class="fixed inset-0 pointer-events-none z-50"></canvas>

    <script>
        // --- 成語資料庫 ---
        const idiomData = [
            { id: 1, text: "朝三暮四", def: "比喻人心意不定，反覆無常。", sentence: "他做事定不下心，總是【____】，一下想學畫畫，一下又想學鋼琴。" },
            { id: 2, text: "利令智昏", def: "因為貪圖利益，而使頭腦昏亂，失去理智。", sentence: "我們不能因為貪圖小便宜而【____】，做出違法的事情。" },
            { id: 3, text: "洛陽紙貴", def: "形容著作風行一時，流傳甚廣。", sentence: "這本小說太好看了，一出版就【____】，大家都搶著買。" },
            { id: 4, text: "張冠李戴", def: "比喻名實不符或弄錯事情、對象。", sentence: "你把小明的書包拿到小華的位子上，真是【____】，搞錯人了。" },
            { id: 5, text: "融會貫通", def: "將各種知識或道理加以融合，進而得到全面透徹的領悟。", sentence: "學習數學要【____】，不能只是死背公式。" },
            { id: 6, text: "漠不關心", def: "形容對人或事物冷淡，一點也不關心。", sentence: "看到同學有困難，我們應該伸出援手，不能【____】。" },
            { id: 7, text: "心平氣和", def: "心情平靜，態度溫和。", sentence: "遇到爭執時，要【____】地溝通，不要亂發脾氣。" },
            { id: 8, text: "一毛不拔", def: "形容人非常吝嗇，不願意付出。", sentence: "他雖然很有錢，但對人非常吝嗇，簡直是【____】。" },
            { id: 9, text: "欲蓋彌彰", def: "想要遮蓋掩飾，反而更加顯露。", sentence: "他想掩飾錯誤，結果越描越黑，反而【____】。" },
            { id: 10, text: "盲人摸象", def: "比喻以偏概全，不能了解真相。", sentence: "看事情要全面，不能像【____】一樣，只看到一部分就下結論。" },
            { id: 11, text: "苦口婆心", def: "形容雖然言語懇切，但出自一片好心。", sentence: "老師【____】地勸導大家要用功讀書，我們應該聽進去。" },
            { id: 12, text: "斬釘截鐵", def: "形容說話辦事堅決果斷，毫不猶豫。", sentence: "爸爸【____】地說：「這件事就這麼決定了，不用再討論！」" },
            { id: 13, text: "細嚼慢嚥", def: "慢慢地吃東西。形容吃東西很文雅或有助消化。", sentence: "吃飯要【____】，對身體比較好，也更能品嘗食物的美味。" },
            { id: 14, text: "朝令夕改", def: "早上發布的命令，晚上就改變了。形容政令或主張反覆無常。", sentence: "班規如果【____】，大家會不知道該怎麼遵守。" },
            { id: 15, text: "餘波盪漾", def: "比喻事情結束後，留下的影響尚未平息。", sentence: "雖然吵架結束了，但他心裡還是【____】，覺得很難過。" },
            { id: 16, text: "史無前例", def: "歷史上從來沒有發生過的。", sentence: "這位運動員打破了世界紀錄，創下了【____】的好成績。" },
            { id: 17, text: "身敗名裂", def: "地位喪失，名譽掃地。形容下場非常淒慘。", sentence: "做壞事終究會被發現，最後只會讓自己【____】。" },
            { id: 18, text: "兵不厭詐", def: "比喻為了達到目的，不排斥使用詭計。", sentence: "比賽場上【____】，我們要隨機應變，小心對手的戰術。" },
            { id: 19, text: "捲土重來", def: "比喻失敗後，重新積聚力量，準備再來。", sentence: "雖然這次比賽輸了，但他決心努力練習，明年【____】。" },
            { id: 20, text: "標新立異", def: "形容創立新奇的名目或主張，以表示與眾不同。", sentence: "他的穿著打扮總是喜歡【____】，和別人很不一樣。" }
        ];

        // --- 遊戲狀態 ---
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let timer = 0;
        let timerInterval;
        
        // --- 初始化 ---
        window.onload = () => {
            lucide.createIcons();
        };

        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            // 隨機打亂並選取題目 (這裡我們全選20題，也可以改成隨機選10題)
            currentQuestions = [...idiomData].sort(() => Math.random() - 0.5);
            currentIndex = 0;
            score = 0;
            timer = 0;
            
            updateUI();
            startTimer();
            loadQuestion();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timer++;
                const mins = Math.floor(timer / 60).toString().padStart(2, '0');
                const secs = (timer % 60).toString().padStart(2, '0');
                document.getElementById('timerDisplay').textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function loadQuestion() {
            const q = currentQuestions[currentIndex];
            const qText = document.getElementById('questionText');
            const optionsGrid = document.getElementById('optionsGrid');
            
            // 顯示題目 (將答案部分替換成底線)
            qText.innerHTML = q.sentence.replace('【____】', '<span class="text-yellow-400 font-bold mx-1 border-b-4 border-yellow-400 inline-block min-w-[100px] text-center">???</span>');

            // 生成選項 (1個正確 + 3個錯誤)
            let options = [q];
            let distractors = idiomData.filter(i => i.id !== q.id).sort(() => Math.random() - 0.5).slice(0, 3);
            options = [...options, ...distractors].sort(() => Math.random() - 0.5);

            // 渲染選項
            optionsGrid.innerHTML = '';
            const codes = ['A', 'B', 'C', 'D'];
            
            options.forEach((opt, idx) => {
                const code = codes[idx];
                const btn = document.createElement('div');
                btn.className = `option-card bg-white rounded-xl p-4 flex items-center gap-4 hover:bg-orange-50 group border border-gray-200`;
                btn.onclick = () => checkAnswer(opt.id === q.id, q, opt);
                
                btn.innerHTML = `
                    <div class="w-12 h-12 rounded-lg bg-gray-100 text-gray-600 font-black text-2xl flex items-center justify-center group-hover:bg-orange-500 group-hover:text-white transition-colors">
                        ${code}
                    </div>
                    <div class="text-xl font-bold text-gray-700 flex-1">
                        ${opt.text}
                    </div>
                `;
                optionsGrid.appendChild(btn);
            });
            
            // 更新進度條
            updateUI();
        }

        function checkAnswer(isCorrect, questionData, selectedOption) {
            // 停止互動
            const buttons = document.querySelectorAll('.option-card');
            buttons.forEach(b => b.onclick = null);

            // *** 暫停計時，讓學生閱讀解釋 ***
            clearInterval(timerInterval);

            const feedbackModal = document.getElementById('feedbackModal');
            const feedbackCard = document.getElementById('feedbackCard');
            const feedbackTitle = document.getElementById('feedbackTitle');
            const feedbackIcon = document.getElementById('feedbackIcon');
            const feedbackCorrectAnswer = document.getElementById('feedbackCorrectAnswer');
            const feedbackDefinition = document.getElementById('feedbackDefinition');

            feedbackModal.classList.remove('hidden');
            // 簡單動畫
            setTimeout(() => {
                feedbackCard.classList.remove('translate-y-full');
            }, 10);

            feedbackCorrectAnswer.textContent = `【${questionData.text}】`;
            feedbackDefinition.textContent = questionData.def;

            if (isCorrect) {
                score += 10; // 每題10分
                playSound('success');
                triggerConfetti(); // 撒花
                feedbackTitle.textContent = "答對了！太棒了！";
                feedbackTitle.className = "text-xl font-bold text-green-600";
                feedbackIcon.innerHTML = '<i data-lucide="check" class="w-6 h-6 text-white"></i>';
                feedbackIcon.className = "p-2 rounded-full bg-green-500";
                
                // 更新畫面上的句子
                document.getElementById('questionText').innerHTML = questionData.sentence.replace('【____】', `<span class="text-green-400 font-bold mx-1">${questionData.text}</span>`);
            } else {
                playSound('error');
                feedbackTitle.textContent = "哎呀！再接再厲！";
                feedbackTitle.className = "text-xl font-bold text-red-500";
                feedbackIcon.innerHTML = '<i data-lucide="x" class="w-6 h-6 text-white"></i>';
                feedbackIcon.className = "p-2 rounded-full bg-red-500";
                
                // 更新畫面上的句子
                document.getElementById('questionText').innerHTML = questionData.sentence.replace('【____】', `<span class="text-red-400 line-through mx-1">${selectedOption.text}</span>`);
            }
            
            updateUI();
            lucide.createIcons();
        }

        function nextQuestion() {
            const feedbackModal = document.getElementById('feedbackModal');
            const feedbackCard = document.getElementById('feedbackCard');
            
            feedbackCard.classList.add('translate-y-full');
            setTimeout(() => {
                feedbackModal.classList.add('hidden');
                currentIndex++;
                
                if (currentIndex >= currentQuestions.length) {
                    endGame();
                } else {
                    loadQuestion();
                    // *** 關閉解釋卡片後，恢復計時 ***
                    startTimer();
                }
            }, 300);
        }

        function updateUI() {
            document.getElementById('scoreDisplay').textContent = score;
            document.getElementById('progressText').textContent = `${currentIndex + 1}/${currentQuestions.length}`;
            const percent = ((currentIndex) / currentQuestions.length) * 100;
            document.getElementById('progressBar').style.width = `${percent}%`;
        }

        function endGame() {
            clearInterval(timerInterval);
            document.getElementById('endScreen').classList.remove('hidden');
            document.getElementById('finalScore').textContent = `${score}分`;
            
            const comment = document.getElementById('teacherComment');
            if (score === 200) {
                comment.textContent = "太驚人了！你是成語小博士！老師為你感到驕傲！🌟";
            } else if (score >= 160) {
                comment.textContent = "表現得非常好！只差一點點就滿分了，繼續保持！👍";
            } else if (score >= 120) {
                comment.textContent = "不錯喔！大部分的成語你都學會了，加油！😊";
            } else {
                comment.textContent = "沒關係，學習成語需要時間，我們多玩幾次就會變厲害囉！💪";
            }
        }

        function restartGame() {
            document.getElementById('endScreen').classList.add('hidden');
            startGame();
        }

        // --- 簡單音效模擬 ---
        function playSound(type) {
            // 在真實專案中可加入 Audio()
            // 這裡僅作為佔位符
        }

        // --- 撒花特效 (沿用) ---
        const canvas = document.getElementById('confettiCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function triggerConfetti() {
            for (let i = 0; i < 50; i++) {
                particles.push({
                    x: window.innerWidth / 2,
                    y: window.innerHeight / 2,
                    vx: (Math.random() - 0.5) * 20,
                    vy: (Math.random() - 1) * 20 - 5,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                    size: Math.random() * 8 + 4,
                    life: 100
                });
            }
            if (particles.length <= 50) requestAnimationFrame(updateParticles);
        }

        function updateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.5; // Gravity
                p.life--;
                
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);

                if (p.life <= 0) particles.splice(i, 1);
            }
            if (particles.length > 0) requestAnimationFrame(updateParticles);
        }

    </script>
</body>
</html>
